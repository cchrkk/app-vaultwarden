---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  information:
    name: Gather app information
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gather version and environment
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          environment="edge"
          version="${SHA:0:7}"
          if [[ "${EVENT_NAME}" = "push" && "${TAG_NAME}" =~ ^v ]]; then
            version="${TAG_NAME#v}"
            environment="stable"
          fi
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & push ${{ matrix.architecture }}
    needs: information
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        architecture: [amd64, aarch64]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Compose build flags
        id: flags
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^name: //p' bitwarden/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "description=$(sed -n 's/^description: //p' bitwarden/config.yaml)" >> "$GITHUB_OUTPUT"
          from="$(sed -n "s/^[[:space:]]*${ARCHITECTURE}:[[:space:]]*//p" src/build.yaml)"
          echo "from=${from}" >> "$GITHUB_OUTPUT"

          if [[ "${ARCHITECTURE}" = "amd64" ]]; then
            echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
          elif [[ "${ARCHITECTURE}" = "aarch64" ]]; then
            echo "platform=linux/arm64/v8" >> "$GITHUB_OUTPUT"
          else
            echo "::error ::Could not determine platform for architecture ${ARCHITECTURE}"
            exit 1
          fi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          EDGE: ${{ needs.information.outputs.environment }}
        with:
          outputs: type=image,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-vaultwarden/${{ matrix.architecture }}:${{ needs.information.outputs.version }}
            ${{ needs.information.outputs.environment == 'edge' && format('ghcr.io/{0}/app-vaultwarden/{1}:edge', github.repository_owner, matrix.architecture) || '' }}
          context: ./src
          file: ./src/Dockerfile
          cache-from: |
            type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
          platforms: ${{ steps.flags.outputs.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ steps.flags.outputs.description }}
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=${{ steps.flags.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.information.outputs.version }}

  manifest:
    name: Build & push multi arch manifest
    needs:
      - information
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        env:
          OWNER: ${{ github.repository_owner }}
          ENVIRONMENT: ${{ needs.information.outputs.environment }}
          VERSION: ${{ needs.information.outputs.version }}
        run: |
          sources=(
            "ghcr.io/${OWNER}/app-vaultwarden/amd64:${VERSION}"
            "ghcr.io/${OWNER}/app-vaultwarden/aarch64:${VERSION}"
          )

          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/app-vaultwarden:${VERSION}" \
            "${sources[@]}"

          if [[ "${ENVIRONMENT}" = "edge" ]]; then
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/app-vaultwarden:edge" \
              "${sources[@]}"
          fi
      - name: Set package visibility to public
        run: |
          for pkg in "app-vaultwarden" "app-vaultwarden%2Famd64" "app-vaultwarden%2Faarch64"; do
            curl -sS -o /dev/null -w "${pkg} -> %{http_code}\n" \
              -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${pkg}" \
              -d '{"visibility": "public"}' || true
          done
